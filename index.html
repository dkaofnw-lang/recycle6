
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>분리수거 도우미</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 18px;
      background: #f3f8f4;
      font-family: Arial, sans-serif;
      color: #263b2e;
    }

    .app {
      max-width: 430px;
      margin: auto;
      background: white;
      padding: 25px 20px;
      border-radius: 25px;
      box-shadow: 0 5px 25px #0000000d;
    }

    .top {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 42px;
    }

    h1 {
      margin: 8px 0;
      font-size: 25px;
    }

    .subtitle {
      color: #829087;
      font-size: 14px;
    }

    .upload-box {
      border: 2px dashed #a8cdb2;
      background: #f7fbf7;
      border-radius: 18px;
      padding: 22px 15px;
      text-align: center;
    }

    .upload-box p {
      color: #728078;
      font-size: 14px;
    }

    input[type="file"] {
      display: none;
    }

    .upload-button {
      display: inline-block;
      background: #e1f1e5;
      color: #317348;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      margin-top: 18px;
      border-radius: 15px;
    }

    .analyze-button {
      width: 100%;
      border: none;
      background: #348653;
      color: white;
      padding: 16px;
      margin-top: 18px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .analyze-button:disabled {
      background: #a8b9ad;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      font-size: 13px;
      color: #829087;
      margin-top: 14px;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 20px;
      border-radius: 18px;
      background: #f1f8f2;
    }

    .result-title {
      color: #66816d;
      font-size: 14px;
    }

    #resultName {
      font-size: 27px;
      font-weight: bold;
      color: #287344;
      margin: 10px 0;
    }

    #resultGuide {
      line-height: 1.7;
      font-size: 14px;
    }

    .confidence {
      font-size: 12px;
      color: #829087;
      margin-top: 12px;
    }

    .notice {
      margin-top: 22px;
      padding: 15px;
      background: #faf8ed;
      border-radius: 13px;
      color: #837b53;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="top">
      <div class="logo">♻️</div>
      <h1>분리수거 도우미</h1>
      <div class="subtitle">사진을 올리면 분리수거 방법을 알려드려요.</div>
    </header>

    <section class="upload-box">
      <div style="font-size:35px;">📷</div>
      <p>분리수거할 물건의 사진을 선택해주세요.</p>

      <label class="upload-button" for="imageInput">
        사진 선택하기
      </label>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >

      <img id="preview" alt="선택한 사진">
    </section>

    <button
      class="analyze-button"
      id="analyzeButton"
      disabled
      onclick="analyzeImage()"
    >
      분리수거 방법 확인하기
    </button>

    <div id="status">사진을 먼저 선택해주세요.</div>

    <section id="result">
      <div class="result-title">분석 결과</div>
      <div id="resultName"></div>
      <div id="resultGuide"></div>
      <div class="confidence" id="confidence"></div>
    </section>

    <div class="notice">
      💡 물건의 재질과 지역별 분리배출 기준에 따라 실제 배출 방법이
      달라질 수 있어요. 내용물을 비우고 깨끗하게 배출해주세요.
    </div>
  </main>

  <script>
    const MODEL_URL =
      "https://teachablemachine.withgoogle.com/models/5I_pRGYeG/";

    let model = null;
    let selectedImage = null;

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const analyzeButton = document.getElementById("analyzeButton");
    const statusText = document.getElementById("status");

    const guides = {
      a: {
        name: "📄 종이",
        guide: "종이는 물기에 젖지 않도록 하고, 비닐이나 테이프 등 다른 재질을 제거한 뒤 납작하게 정리해서 배출해주세요."
      },
      b: {
        name: "🥫 캔",
        guide: "내용물을 비우고 가능한 한 깨끗하게 헹군 뒤 배출해주세요. 다른 재질의 뚜껑이나 부착물은 분리해주세요."
      },
      c: {
        name: "🧴 플라스틱",
        guide: "내용물을 비우고 헹군 뒤 라벨 등 다른 재질을 분리해주세요. 가능한 경우 부피를 줄여 배출해주세요."
      }
    };

    imageInput.addEventListener("change", function(event) {
      const file = event.target.files[0];

      if (!file) return;

      if (!file.type.startsWith("image/")) {
        statusText.textContent = "이미지 파일을 선택해주세요.";
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = "block";

        preview.onload = function() {
          selectedImage = preview;
          analyzeButton.disabled = false;
          statusText.textContent = "사진이 준비되었어요!";
          document.getElementById("result").style.display = "none";
        };
      };

      reader.readAsDataURL(file);
    });

    async function analyzeImage() {
      if (!selectedImage) return;

      analyzeButton.disabled = true;
      statusText.textContent = "AI가 사진을 분석하고 있어요...";
      document.getElementById("result").style.display = "none";

      try {
        if (!model) {
          model = await tmImage.load(
            MODEL_URL + "model.json",
            MODEL_URL + "metadata.json"
          );
        }

        const predictions = await model.predict(selectedImage);

        predictions.sort((a, b) => b.probability - a.probability);

        const top = predictions[0];
        const className = top.className.trim().toLowerCase();

        if (top.probability < 0.6 || !guides[className]) {
          statusText.textContent =
            "종류를 정확하게 판단하기 어려워요. 다른 사진으로 다시 시도해주세요.";
          return;
        }

        const result = guides[className];

        document.getElementById("resultName").textContent =
          result.name;

        document.getElementById("resultGuide").textContent =
          result.guide;

        document.getElementById("confidence").textContent =
          "AI 예측 신뢰도: " +
          (top.probability * 100).toFixed(1) + "%";

        document.getElementById("result").style.display = "block";

        statusText.textContent = "분석이 완료되었어요!";

      } catch (error) {
        console.error("분석 오류:", error);
        statusText.textContent =
          "분석 중 오류가 발생했어요: " + error.message;
      } finally {
        analyzeButton.disabled = false;
      }
    }
  </script>
</body>
</html>
